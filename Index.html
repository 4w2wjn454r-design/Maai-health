<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maai Health | Your Health, Wherever You Go</title><style>:root{--teal:#087e88;--aqua:#19b6bf;--ink:#132e3a;--muted:#6c8790;--bg:#f3fafb}*{box-sizing:border-box}body{margin:0;background:#dceff1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}#app{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);padding:22px 18px 110px;box-shadow:0 0 30px #14505a14}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:850;color:#087e88;letter-spacing:-1px}.brand em{font-style:normal;color:#19b6bf}.pill{font-size:11px;color:#087e88;background:#d9f4f5;padding:7px 10px;border-radius:20px;font-weight:750}h1{font-size:25px;letter-spacing:-.6px;margin:23px 0 7px}h2{font-size:18px;margin:22px 0 12px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.hero{background:linear-gradient(125deg,#076e7b,#1bb5be);border-radius:22px;color:white;padding:22px;margin:20px 0;box-shadow:0 10px 25px #0b919326}.hero small{opacity:.8;font-weight:700;letter-spacing:1px}.hero h2{font-size:24px;margin:14px 0 9px}.hero p{font-size:13px;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{border:1px solid #e2edef;background:white;border-radius:16px;padding:20px 8px;font-size:13px;font-weight:700;color:var(--ink);min-height:105px;box-shadow:0 4px 14px #113c4508}.tile span{display:block;font-size:27px;margin-bottom:10px}.card{background:white;border:1px solid #e0eef0;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #12313e08}.item{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:12px;width:100%;padding:15px 0;background:none;border:0;border-bottom:1px solid #eaf1f2;color:var(--ink)}.item:last-child{border-bottom:0}.item strong{dis case 'passport':c=back('Your Health Passport')+`<div class="hero center"><div class="globe">🌍✈️</div><h2>Travel with confidence</h2><p>Your health history travels with you.</p></div>`+card(row('Digital Health Passport','passport-summary','Patient information')+row('International Sharing','share','Demo sharing')+row('Emergency Summary','passport-summary','Medical overview')+row('Document Translation','translation','Demo feature'));break;case 'passport-summary':c=back('Health Passport Summary')+card(`<h2>${esc(name)}</h2><p>Patient ID: SND-784321</p><p>Blood type: O+</p><p>Allergies: None recorded (demo)</p>`);break;case 'translation':c=back('Translation')+card('Translation is a planned feature. This demo does not connect to a translation service.');break;
case 'doctors':c=back('August AI & Real Doctors')+`<div class="tabs"><button class="${doctorTab==='ai'?'active':''}" data-action="tab-ai">August AI</button><button class="${doctorTab==='real'?'active':''}" data-action="tab-real">Real doctors</button></div>`+(doctorTab==='ai'?`<div class="card"><strong>August AI — Health Assistant</strong><p>Ask health questions, learn about symptoms, and understand lab reports through the official August AI service.</p><p class="muted">August is an independent third-party service. Your Maai Health records are not automatically shared with August.</p><button class="primary" data-page="august-chat">Open August AI</button></div><p class="ai-warning" role="alert">⚠ Important: August AI does not replace professional medical advice, diagnosis, or treatment. Always consult a qualified doctor. For emergencies, contact local emergency services.</p><div class="card"><strong>Maai Health — Record Questions</strong><p class="muted">These three answers use the fictional information in this app, not August AI.</p><p>1. What medications am I taking?</p><p>2. What is my blood type?</p><p>3. Do I have any allergies?</p><input class="field" id="chatText" placeholder="Ask one of the three record questions..." maxlength="300"><button class="secondary" data-action="chat">Check my record</button></div>${chat.map(x=>`<div class="bubble ${x.me?'me':''}">${esc(x.text)}</div>`).join('')}`:card('<strong>Dr. Khalid Al-Mansoori</strong><p class="muted">General Medicine</p><button class="primary" data-action="book">Book Appointment</button>')+card('<strong>Dr. Maryam Al-Kuwari</strong><p class="muted">Internal Medicine</p><button class="secondary" data-action="book">Book Appointment</button>')+card('<strong>Dr. Aisha Al-Naemi</strong><p class="muted">Family Medicine</p><button class="secondary" data-action="book">Book Appointment</button>')+card('<strong>Dr. Fahad Al-Hajri</strong><p class="muted">Dermatology</p><button class="secondary" data-action="book">Book Appointment</button>'));break;
case 'august-chat':c=back('August AI Chat')+`<div class="card"><h2>August AI — Health Chat</h2><p class="muted">Ask August AI health questions using its official chat service.</p><div class="bubble">Hi! What would you like to ask about your health?</div><label for="augustQuestion">Your question</label><textarea class="field" id="augustQuestion" rows="4" placeholder="Type any health question here..."></textarea><button class="primary" data-action="ask-august">Continue to August AI chat</button><p class="muted">Your question will be copied if your browser allows it. Paste it into August's chat. The actual AI conversation takes place on August's service, not inside Maai Health.</p></div><p class="ai-warning" role="alert">⚠ Important: August AI does not replace professional medical advice. Always consult a qualified doctor for diagnosis and treatment.</p>`;break;
case 'doctor':c=back('Doctor Portal')+card(`<strong>🩺 Maai Health — Doctor Portal</strong><p class="muted">Fictional patient · No hospital connection</p><h2>${esc(name)}</h2><p>Patient ID: SND-784321</p><span class="tag">Patient</span>`)+`<div class="warning">⚠️ Similar test found in patient history. Review the previous result before ordering another test.</div><button class="primary" data-page="doctorlabs">Review Previous Test</button><button class="secondary" data-page="order">Order New Test</button><h2>Patient Records</h2><div class="grid">${btn('Medical History','history','📋')}${btn('Lab Results','doctorlabs','🧪')}${btn('Medications','meds','💊')}${btn('Allergies','allergies','🩹')}</div>`;break;case 'order':c=back('Order New Test')+card('<p class="muted">Add a fictional test order for the presentation.</p><input id="testName" class="field" placeholder="e.g. Blood Glucose"><button class="primary" data-action="order">Add Test Order</button>');break;
case 'access':c=back('Doctor Access')+`<p class="muted">Doctors can request a patient's record with their medical badge and the patient's QID.</p>${card('<label>Medical badge number</label><input id="badge" class="field" placeholder="[BADGE NUMBER]" maxlength="30"><label>Patient QID</label><input id="qid" class="field" inputmode="numeric" placeholder="[QID NUMBER]" maxlength="20"><button class="primary" data-action="request-access">Request to open record</button>')}<div class="warning">Every access is logged. Patients can see which doctor opened their record and when. Hospital verification is not connected.</div>${card(row('Patient Approval','request','Approve or deny access')+row('Emergency Access','emergency','Limited emergency access')+row('Access Log','accesslog','Review previous access'))}`;break;
case 'request':c=back('Access Request')+(request&&request.status==='pending'?card(`<p class="muted">A doctor wants to open your record.</p><h2>Dr. Khalid Al-Mansoori</h2><p>Hamad General Hospital (fictional listing)</p><span class="tag">Badge not verified</span>`)+card(`<h3>They will see</h3>${['Conditions','Allergies','Medications','Past surgeries','Lab results'].map(x=>`<label class="check"><input type="checkbox" data-scope="${x}" ${selected.includes(x)?'checked':''}>${x}</label>`).join('')}`)+`<p class="muted">Access ends automatically after 24 hours.</p><button class="primary" data-action="approve">Approve</button><button class="secondary outline-danger" data-action="deny">Deny</button>`:card('<p>No pending doctor access requests.</p><button class="secondary" data-page="access">Create an access request</button>'));break;
case 'accesslog':c=back('Who Opened My Record')+'<p class="muted">Every time a doctor opens your record in this browser demo, it is listed here.</p>'+(accessLog.length?accessLog.map((x,i)=>card(`<strong>${esc(x.doctor)}</strong><p class="muted">${esc(x.kind)} · ${esc(x.time)}</p><span class="tag">${x.status==='active'&&x.expiry&&Date.now()>x.expiry?'Ended':esc(x.status)}</span>`)).join(''):card('No access history yet.'))+(accessLog.some(x=>x.status==='active')?'<button class="secondary" data-action="revoke">Revoke active access</button>':'');break;
case 'emergency':c=back('Emergency Access')+`<p class="muted">For when the patient cannot approve in time. The patient is notified in this demo's access history.</p>${card('<label>Medical badge number</label><input id="emBadge" class="field" placeholder="[BADGE NUMBER]"><label>Patient QID</label><input id="emQid" class="field" inputmode="numeric" placeholder="[QID NUMBER]"><label>Reason for emergency access</label><input id="reason" class="field" placeholder="Describe the emergency">')}<div class="warning">Hospital badge verification is not connected.</div><div class="warning">Limited and logged: only allergies, medications and conditions open, for 1 hour, and the use is recorded.</div><button class="primary danger" data-action="emergency">Open in emergency</button>`;break;
case 'emergency-summary':c=back('Emergency Medical Summary')+card('<strong>Emergency Record</strong><p>Allergies: None recorded</p><p>Medications: None recorded</p><p>Conditions: None recorded</p><p class="muted">Emergency access expires after one hour.</p>');break;default:c=back('Maai Health')}
$('app').innerHTML=(page==='welcome'?'':`<div class="logout-bar"><button data-action="logout" class="logout-btn">Log Out ↗</button></div>`)+c+`<p class="notice">Maai Health prototype · Doctor identities and records are fictional. No hospital, booking, or identity-verification system is connected. Do not enter real personal information.</p>`+(page==='welcome'?'':`<nav>${[['⌂','Home','home'],['▤','Records','records'],['⇧','Share','share'],['✚','Doctors','doctors'],['♙','Access','access']].map(x=>`<button data-page="${x[2]}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</nav>`);window.scrollTo(0,0)}
$('app').addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;let a=t.dataset.action;if(t.dataset.page){page=t.dataset.page;render();return}if(a==='logout'){localStorage.removeItem('sanadDemoName');name='';page='welcome';chat=[];render();return}else if(a==='ask-august'){let q=$('augustQuestion').value.trim();if(!q)return alert('Please type your question first');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(q).catch(()=>{});}window.open('https://www.meetaugust.ai/','_blank','noopener,noreferrer');alert('August AI is opening. Paste your question into the official chat.');return}else if(a==='setname'){let v=$('patientName').value.trim();if(!v)return alert('Please enter a patient name');name=v;localStorage.setItem('sanadDemoName',name);page='home';render()}else if(t.dataset.report!==undefined){let x=[...orders,...tests][+t.dataset.report];alert(x.name+'\n'+x.date+'\n'+(x.details||'Demo order pending'))}else if(a==='grant'){granted=true;render();alert('Illustrative sharing only; no real records shared.')}else if(a==='order'){let v=$('testName').value.trim();if(!v)return alert('Enter a test name');orders.unshift({name:v,date:'New order',status:'Ordered'});page='doctorlabs';render()}else if(a==='tab-ai'||a==='tab-real'){doctorTab=a==='tab-ai'?'ai':'real';render()}else if(a==='august-link'){window.open('https://www.meetaugust.ai/','_blank','noopener,noreferrer');return}else if(a==='chat'){let v=$('chatText').value.trim();if(!v)return;const qa=[['what medications am i taking','Your record lists no active prescriptions.'],['what is my blood type','Your recorded blood type is O positive (O+).'],['do i have any allergies','Your record currently lists no known allergies.']];let q=v.toLowerCase().replace(/[?!.]/g,'').trim();let found=qa.find(x=>x[0]===q);chat.push({me:true,text:v},{me:false,text:found?found[1]:'I can answer three questions: What medications am I taking? What is my blood type? Do I have any allergies?'});render()}else if(a==='book'){alert('Appointment request saved locally. No real booking was made.')}else if(a==='request-access'){if(!$('badge').value.trim()||!$('qid').value.trim())return alert('Complete both fields with fictional demo values only');request={status:'pending'};save();page='request';render()}else if(a==='approve'){request.status='approved';logEntry('Standard access','active');accessLog[0].expiry=Date.now()+86400000;save();page='accesslog';render()}else if(a==='deny'){request.status='denied';logEntry('Access request','denied');page='accesslog';render()}else if(a==='revoke'){accessLog.forEach(x=>{if(x.status==='active')x.status='revoked'});save();render()}else if(a==='emergency'){if(!$('emBadge').value.trim()||!$('emQid').value.trim()||!$('reason').value.trim())return alert('Complete all fields with fictional demo values');if(!confirm('Simulate limited emergency access for one hour? No real medical records are accessed.'))return;logEntry('Emergency access','active');accessLog[0].expiry=Date.now()+3600000;save();page='emergency-summary';render()}});$('app').addEventListener('change',e=>{if(e.target.dataset.scope){let v=e.target.dataset.scope;selected=e.target.checked?[...new Set([...selected,v])]:selected.filter(x=>x!==v)}});render();
</script></body></html>
